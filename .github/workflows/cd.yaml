name: CD

permissions:
  contents: read
  id-token: write

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  push-to-registry:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v7

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Bypass Cloudflare for GitHub Action
        uses: https://github.com/xiaotianxt/bypass-cloudflare-for-github-action@v2.1.0
        with:
          cf_account_id: ${{ secrets.CF_ACCOUNT_ID }}
          cf_zone_id: ${{ secrets.CF_ZONE_ID }}
          cf_api_token: ${{ secrets.CF_API_TOKEN }}
          disable_bot_fight_mode: "true"

      - name: Login to container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.REGISTRY_HOSTNAME }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-docker-buildx-cache

      - name: Run deploy script
        run: BUILDX_CACHE_DIR=/tmp/.buildx-cache ./deploy.sh
